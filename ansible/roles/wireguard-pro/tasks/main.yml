---
- name: Include encrypted variables
  ansible.builtin.include_vars:
    file: ../../secrets.yml
    name: vaulted_secrets

# Rootless containers can't use /dev/net/tun under SELinux's default container policy
- name: Install SELinux policy module for WireGuard Pro TUN access
  when: ansible_facts['selinux']['status'] == 'enabled'
  become_user: root
  block:
    - name: Ensure SELinux policy compiler is installed
      ansible.builtin.package:
        name: checkpolicy
        state: present

    - name: Create SELinux module directory
      ansible.builtin.file:
        path: /usr/local/share/selinux/wireguard_pro_tun
        state: directory
        mode: '0755'

    - name: Copy SELinux module source
      ansible.builtin.copy:
        src: wireguard_pro_tun.te
        dest: /usr/local/share/selinux/wireguard_pro_tun/wireguard_pro_tun.te
        mode: '0644'
      register: selinux_te_copied

    - name: Check if SELinux module is loaded
      ansible.builtin.shell:
        cmd: semodule -l | grep -qx wireguard_pro_tun
      register: selinux_module_check
      failed_when: false
      changed_when: false

    - name: Compile and load SELinux module
      ansible.builtin.shell:
        cmd: >
          checkmodule -M -m -o wireguard_pro_tun.mod wireguard_pro_tun.te &&
          semodule_package -o wireguard_pro_tun.pp -m wireguard_pro_tun.mod &&
          semodule -i wireguard_pro_tun.pp
        chdir: /usr/local/share/selinux/wireguard_pro_tun
      when: selinux_te_copied.changed or selinux_module_check.rc != 0

- name: Check if WireGuard admin-user secret exists
  ansible.builtin.command:
    cmd: podman secret exists admin-user
  register: admin_user_secret_check
  failed_when: false
  changed_when: false

- name: Create WireGuard admin-user secret from vault if it does not exist
  containers.podman.podman_secret:
    name: admin-user
    data: "{{ vaulted_secrets.wg_admin_user }}"
    state: present
  when: admin_user_secret_check.rc != 0
  register: user_secret_created

- name: Check if WireGuard admin-pass secret exists
  ansible.builtin.command:
    cmd: podman secret exists admin-pass
  register: admin_pass_secret_check
  failed_when: false
  changed_when: false

- name: Create WireGuard admin-pass secret from vault if it does not exist
  containers.podman.podman_secret:
    name: admin-pass
    data: "{{ vaulted_secrets.wg_admin_pass }}"
    state: present
  when: admin_pass_secret_check.rc != 0
  register: pass_secret_created

- name: Copy WireGuard Pro socket unit to user systemd directory
  ansible.builtin.copy:
    src: "wireguard-pro.socket"
    dest: "~/.config/systemd/user/"
    mode: '0644'
  register: socket_copied

- name: Copy WireGuard Pro container unit to user quadlet directory
  ansible.builtin.copy:
    src: "wireguard-pro.container"
    dest: "~/.config/containers/systemd/"
    mode: '0644'
  register: container_copied

- name: "Copy WireGuard Pro firewall configs to user-space configuration directory"
  ansible.builtin.copy:
    src: "nftables.json"
    dest: "~/.config/wireguard-pro/"
    mode: '0644'
  register: firewall_copied

- name: "Copy WireguardPro environment values to user space configuration directory"
  ansible.builtin.copy:
    src: "env"
    dest: "~/.config/wireguard-pro/"
    mode: '0600'
  register: env_copied

- name: Reload systemd if unit files changed
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: >
    user_secret_created.changed or
    pass_secret_created.changed or
    socket_copied.changed or
    container_copied.changed or
    firewall_copied.changed or
    env_copied.changed

- name: Pull latest wireguard-pro image
  containers.podman.podman_image:
    name: ghcr.io/jack-turk-5/wireguard/wireguard-pro:latest
    pull: true
  register: pull_result

- name: Reload systemd and restart socket if container was updated
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
    name: wireguard-pro.socket
    state: restarted
  when: pull_result.changed

- name: Ensure WireGuard Pro socket is enabled and started
  ansible.builtin.systemd:
    scope: user
    name: wireguard-pro.socket
    enabled: true
    state: started
