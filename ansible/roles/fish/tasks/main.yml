---
- name: Set shell for current user to fish
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/fish
  become: true # This task needs to become root to modify /etc/passwd

- name: Create fish config directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/fish/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - functions
    - conf.d

- name: Copy fish config, prompt, greeting (fastfetch) and theme
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/fish/{{ item }}"
    mode: '0644'
  loop:
    - config.fish
    - functions/fish_prompt.fish
    - functions/fish_greeting.fish
    - conf.d/fish_frozen_theme.fish
    - conf.d/podman.fish
